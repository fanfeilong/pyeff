[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyeff"
version = "0.2.0"
description = "User-friendly Python utilities for daily coding tasks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Fan Fei Long", email = "fanfeilong@gmail.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = ["utilities", "filesystem", "yaml", "json", "shell", "developer-tools"]

dependencies = [
    "loguru>=0.6.0",
    "pyyaml>=5.1",
    "pyyaml-include>=2.0",
]

[project.optional-dependencies]
async = ["aiofiles>=23.0.0"]
ssh = ["paramiko>=3.0.0"]
s3 = ["boto3>=1.28.0"]
gcs = ["google-cloud-storage>=2.10.0"]
azure = ["azure-storage-blob>=12.17.0"]
smb = ["smbprotocol>=1.10.0"]
cloud = ["pyeff[s3,gcs,azure]"]
nas = ["pyeff[smb]"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "aiofiles>=23.0.0",
    "paramiko>=3.0.0",
    "boto3>=1.28.0",
]
all = ["pyeff[async,ssh,cloud,nas,dev]"]

[project.urls]
Homepage = "https://github.com/fanfeilong/pyeff"
Repository = "https://github.com/fanfeilong/pyeff.git"
Issues = "https://github.com/fanfeilong/pyeff/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyeff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/pyeff"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
